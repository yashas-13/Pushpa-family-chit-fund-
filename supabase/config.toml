# Local Supabase configuration for Pushpa Family Chit.
# Production project settings and credentials are never stored here.
project_id = "pushpa-family-chit-fund"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./supabase/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.payment-proofs]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[storage.buckets.receipts]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["application/pdf"]
