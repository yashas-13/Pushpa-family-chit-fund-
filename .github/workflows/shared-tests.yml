name: Shared Domain Tests

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run shared tests with diagnostic log
        id: tests
        shell: bash
        run: |
          set +e
          gradle :shared:jvmTest --stacktrace --console=plain 2>&1 | tee shared-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload shared test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-log
          path: shared-test.log

      - name: Fail if shared tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
