name: PushpaFamilyChit
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  bundleIdPrefix: in.pravidh

targets:
  PushpaFamilyChit:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: in.pravidh.pushpachit
      INFOPLIST_FILE: Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      FRAMEWORK_SEARCH_PATHS: "$(inherited) $(TARGET_BUILD_DIR)/Frameworks"
      OTHER_LDFLAGS: "$(inherited) -framework SharedKit"
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    scheme:
      testTargets: []
